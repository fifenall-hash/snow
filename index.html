class Rect {
    constructor(x, y, width, height) {
        this.x = x; this.y = y; this.width = width; this.height = height;
    }
    get left() { return this.x; } set left(v) { this.x = v; }
    get right() { return this.x + this.width; } set right(v) { this.x = v - this.width; }
    get top() { return this.y; } set top(v) { this.y = v; }
    get bottom() { return this.y + this.height; } set bottom(v) { this.y = v - this.height; }
    get centerx() { return this.x + this.width / 2; } set centerx(v) { this.x = v - this.width / 2; }
    get centery() { return this.y + this.height / 2; } set centery(v) { this.y = v - this.height / 2; }
    
    copy() { return new Rect(this.x, this.y, this.width, this.height); }
    colliderect(other) {
        return !(other.left >= this.right || other.right <= this.left ||
                 other.top >= this.bottom || other.bottom <= this.top);
    }
    collidepoint(px, py) { return px >= this.left && px < this.right && py >= this.top && py < this.bottom; }
    inflate(dw, dh) { return new Rect(this.x - dw/2, this.y - dh/2, this.width + dw, this.height + dh); }
}

// 이미지 로더
const loadedImages = {};
function loadImg(path, width, height, fallbackColor = "rgba(200, 200, 200, 0.5)") {
    if (!loadedImages[path]) {
        const img = new Image(); img.src = `images/${path}`;
        loadedImages[path] = { img: img, w: width, h: height, color: fallbackColor };
    }
    return loadedImages[path];
}

function drawImageOrFallback(ctx, imgObj, x, y, isCentered = false, alpha = 1.0) {
    if (!imgObj) return;
    ctx.globalAlpha = alpha;
    let drawX = x, drawY = y;
    if (isCentered) { drawX = x - imgObj.w / 2; drawY = y - imgObj.h; }
    if (imgObj.img.complete && imgObj.img.naturalWidth > 0) ctx.drawImage(imgObj.img, drawX, drawY, imgObj.w, imgObj.h);
    else { 
        if (imgObj.color !== "transparent") {
            ctx.fillStyle = imgObj.color; ctx.fillRect(drawX, drawY, imgObj.w, imgObj.h); 
        }
    }
    ctx.globalAlpha = 1.0;
}

// [핵심 추가] 실제 사운드 처리 클래스
class RealSound {
    constructor(path, isBgm = false) {
        this.audio = new Audio(`sounds/${path}`);
        if (isBgm) this.audio.loop = true;
    }
    play() {
        if (this.audio.loop) {
            this.audio.play().catch(() => {}); // 자동재생 방지 에러 무시
        } else {
            // 효과음이 겹쳐서 들릴 수 있도록 복제하여 재생
            let clone = this.audio.cloneNode();
            clone.volume = this.audio.volume;
            clone.play().catch(() => {});
        }
    }
    stop() {
        this.audio.pause();
        this.audio.currentTime = 0;
    }
    get_length() {
        return this.audio.duration || 5.0; // 오디오 길이 반환
    }
}

function loadSound(path, isBgm = false) { return new RealSound(path, isBgm); }

function getStageData(allData, stageNum) {
    const stageKey = `stage_${stageNum}`;

        const pData = allData[stageKey].platforms;
        const eData = allData[stageKey].enemies;
        const colW = allData[stageKey].col_widths || Array(10).fill(DEFAULT_GRID_W);

    }
    return [ [], [], [] ];
}
function autoSaveCurrentStage(stageNum, platforms, enemies, colWidths, allData) {
    allData[`stage_${stageNum}`] = {
        platforms: platforms.map(p => [p.rect.x, p.rect.y, p.rect.width, p.rect.height, p.passable, p.isWall]),
        enemies: enemies.map(e => [e.rect.x, e.rect.y]), col_widths: colWidths
    };
    saveAllStages(allData);
}

function updatePlatformEdges(platforms) {
    for (let p of platforms) {
        if (p.passable || p.isWall) {
            p.exposedTop = true; p.exposedLeft = true; p.exposedRight = true;
        } else {
            p.exposedTop = !platforms.some(o => o !== p && !o.passable && o.rect.bottom === p.rect.top && o.rect.left < p.rect.right && o.rect.right > p.rect.left);
            p.exposedLeft = !platforms.some(o => o !== p && !o.passable && o.rect.right === p.rect.left && o.rect.top < p.rect.bottom && o.rect.bottom > p.rect.top);
            p.exposedRight = !platforms.some(o => o !== p && !o.passable && o.rect.left === p.rect.right && o.rect.top < p.rect.bottom && o.rect.bottom > p.rect.top);
        }
    }
}

// --- 3. 클래스 정의 ---
class Platform {
    constructor(x, y, width, height, passable = true, isWall = false) {
        this.rect = new Rect(x, y, width, height); this.passable = passable; this.isWall = isWall;
        this.exposedTop = true; this.exposedLeft = true; this.exposedRight = true;
    }
    draw(ctx) {
        ctx.fillStyle = this.passable ? "rgba(100, 200, 100, 0.6)" : "rgba(80, 80, 80, 0.6)";
        ctx.fillRect(this.rect.x, this.rect.y, this.rect.width, this.rect.height);
    }
}

class Snowball {
    constructor(x, y, direction, startX) {
        this.width = 42; this.height = 89;
        this.rect = new Rect(direction === 1 ? x : x - this.width, y, this.width, this.height);
        this.speed = 12 * direction; this.startX = startX; this.direction = direction;
        this.imgL = loadImg("snowflake_L.png", this.width, this.height, "white");
        this.imgR = loadImg("snowflake_R.png", this.width, this.height, "white");
    }
    update() {
        this.rect.x += this.speed;
        let diff = Math.abs(this.rect.x - (this.direction === 1 ? this.startX : this.startX - this.width));
        return diff > 314;
    }
    draw(ctx) { drawImageOrFallback(ctx, this.direction === 1 ? this.imgR : this.imgL, this.rect.x, this.rect.y); }
}

class Effect {
    constructor(x, y, width, height) {
        this.rect = new Rect(x - width/2, y - height/2, width, height);
        this.img = loadImg("flake_end.png", width, height, "yellow");
        this.timer = 15;
    }
    update() { this.timer--; return this.timer <= 0; }
    draw(ctx) { drawImageOrFallback(ctx, this.img, this.rect.x, this.rect.y); }
}

class Enemy {
    constructor(x, y) {
        this.width = 128; this.height = 123;
        this.rect = new Rect(x, y, this.width, this.height);
        this.x = x; this.y = y; this.velY = 0; this.gravity = 0.5;
        this.snowLevel = 0; this.rollingDir = 0; this.rollingSpeed = 15;
        this.meltTimer = 0; this.meltThreshold = FPS * 3;
        this.isDead = false; this.facing = 1;
        
        this.img = loadImg("enemy.png", this.width, this.height, "red");
        this.imgSbL = [1,2,3,4].map(i => loadImg(`snowball${i}_L.png`, this.width, this.height, "white"));
        this.imgSbR = [1,2,3,4].map(i => loadImg(`snowball${i}_R.png`, this.width, this.height, "white"));
    }
    get hitWidth() { return this.snowLevel >= 4 ? 60 : this.width; }
    get hitHeight() { return this.snowLevel >= 4 ? 100 : this.height; }
    get hitOffsetX() { return Math.floor((this.width - this.hitWidth) / 2); }
    get hitOffsetY() { return this.height - this.hitHeight; }
    get fullHitRect() { return new Rect(this.rect.x + this.hitOffsetX, this.rect.y + this.hitOffsetY, this.hitWidth, this.hitHeight); }
    get terrainRect() { return new Rect(this.rect.x + this.hitOffsetX, this.rect.bottom - 70, this.hitWidth, 70); }
    get floorRect() { 
        let w = Math.floor(this.hitWidth / 2);
        return new Rect(this.rect.x + Math.floor((this.width - w) / 2), this.rect.bottom - 70, w, 70);
    }
    
    applyPhysics(platforms) {
        let prevBottom = this.rect.bottom;
        this.velY += this.gravity; this.y += this.velY; this.rect.y = Math.floor(this.y);
        for (let plat of platforms) {
            if (plat.isWall || plat.exposedTop) {
                if (this.floorRect.colliderect(plat.rect) && this.velY > 0 && prevBottom <= plat.rect.top + 2) {
                    this.rect.bottom = plat.rect.top; this.y = this.rect.y; this.velY = 0;
                }
            }
        }
        if (this.y > HEIGHT + 200) this.isDead = true;
    }
    
    updateLogic(platforms, rollingSound) {
        if (this.rollingDir !== 0) {
            let dx = this.rollingSpeed * this.rollingDir;
            let origTerrain = this.terrainRect.copy();
            this.x += dx; this.rect.x = Math.floor(this.x);
            let hitWall = false;
            for (let plat of platforms) {
                if (!plat.passable && this.terrainRect.colliderect(plat.rect)) {
                    if (plat.isWall || (dx > 0 && plat.exposedLeft) || (dx < 0 && plat.exposedRight)) {
                        if (dx > 0 && origTerrain.right <= plat.rect.left) {
                            this.x = plat.rect.left - this.hitOffsetX - this.hitWidth; this.rect.x = Math.floor(this.x);
                            hitWall = true; break;
                        } else if (dx < 0 && origTerrain.left >= plat.rect.right) {
                            this.x = plat.rect.right - this.hitOffsetX; this.rect.x = Math.floor(this.x);
                            hitWall = true; break;
                        }
                    }
                }
            }
            if (hitWall) {
                if (this.rect.bottom >= HEIGHT - FLOOR_THICKNESS) this.isDead = true;
                else { this.rollingDir *= -1; if(rollingSound) rollingSound.play(); }
            }
        } else {
            if (this.snowLevel > 0) {
                this.meltTimer++;
                if (this.meltTimer >= this.meltThreshold) { this.snowLevel--; this.meltTimer = 0; }
            }
        }
    }
    
    draw(ctx) {
        if (this.snowLevel === 0) drawImageOrFallback(ctx, this.img, this.rect.x, this.rect.y);
        else {
            let imgs = this.facing === -1 ? this.imgSbL : this.imgSbR;
            let idx = Math.min(this.snowLevel - 1, 3);
            drawImageOrFallback(ctx, imgs[idx], this.rect.x, this.rect.y);
        }
    }
}

class Player {
    constructor(x, y) {
        this.width = 99; this.height = 139;
        this.rect = new Rect(x, y, this.width, this.height);
        this.x = x; this.y = y; this.velY = 0; this.speed = 6;
        this.gravity = 0.5; this.jumpPower = -12.25;
        this.onGround = false; this.facing = 1;
        this.shootCooldown = 0; this.lives = 2;
        this.sweptBy = null; this.invincibleTimer = 0;
        this.kickFreezeTimer = 0; this.isCrouching = false;
        this.attackTimer = 0; this.currentPlatform = null;

        this.imgL = loadImg("player_L.png", this.width, this.height, "blue");
        this.imgR = loadImg("player_R.png", this.width, this.height, "blue");
        this.imgDownL = loadImg("down_L.png", 104, 95, "lightblue");
        this.imgDownR = loadImg("down_R.png", 104, 95, "lightblue");
        this.imgAttackL = loadImg("attack_L.png", 111, 138, "cyan");
        this.imgAttackR = loadImg("attack_R.png", 111, 138, "cyan");
        this.imgClear = loadImg("clear.png", this.width, this.height, "green");
    }

    get terrainRect() { return new Rect(this.rect.x, this.rect.bottom - 70, this.rect.width, 70); }
    get floorRect() { 
        let w = Math.floor(this.rect.width / 2); let offsetX = Math.floor((this.rect.width - w) / 2);
        return new Rect(this.rect.x + offsetX, this.rect.bottom - 70, w, 70);
    }

    respawn() {
        this.x = 100.0; this.y = HEIGHT - FLOOR_THICKNESS - this.height;
        this.rect.x = this.x; this.rect.y = this.y;
        this.velY = 0; this.onGround = false; this.sweptBy = null;
        this.invincibleTimer = 90; this.kickFreezeTimer = 0;
        this.isCrouching = false; this.attackTimer = 0;
    }

    moveX(keys, enemies, platforms) {
        if (this.sweptBy) {
            this.rect.centerx = this.sweptBy.fullHitRect.centerx;
            this.rect.bottom = this.sweptBy.fullHitRect.bottom;
            this.x = this.rect.x; this.y = this.rect.y; this.velY = 0;
            return;
        }
        if (this.kickFreezeTimer > 0) return;
        
        let isDown = keys["ArrowDown"] || keys["s"] || keys["S"];
        let isLeft = keys["ArrowLeft"] || keys["a"] || keys["A"];
        let isRight = keys["ArrowRight"] || keys["d"] || keys["D"];

        this.isCrouching = isDown;
        let dx = 0;
        if (!this.isCrouching) {
            if (isLeft) { dx = -this.speed; this.facing = -1; }
            if (isRight) { dx = this.speed; this.facing = 1; }
        } else {
            if (isLeft) this.facing = -1;
            if (isRight) this.facing = 1;
        }
        
        let origTerrain = this.terrainRect.copy();
        this.x += dx; this.rect.x = Math.floor(this.x);

        for (let plat of platforms) {
            if (!plat.passable && this.terrainRect.colliderect(plat.rect)) {
                if (dx > 0 && (plat.isWall || plat.exposedLeft) && origTerrain.right <= plat.rect.left) {
                    this.rect.right = plat.rect.left; this.x = this.rect.x;
                } else if (dx < 0 && (plat.isWall || plat.exposedRight) && origTerrain.left >= plat.rect.right) {
                    this.rect.left = plat.rect.right; this.x = this.rect.x;
                }
            }
        }

        for (let enemy of enemies) {
            if (enemy.snowLevel >= 4 && enemy.rollingDir === 0) {
                if (this.rect.colliderect(enemy.fullHitRect)) {
                    let isZ = keys["KeyZ"] || keys["z"] || keys["Z"];
                    if (isZ) { 
                        if (dx > 0) this.rect.right = enemy.fullHitRect.left;
                        else if (dx < 0) this.rect.left = enemy.fullHitRect.right;
                        this.x = this.rect.x;
                    } else { 
                        let pushSpeed = this.speed / 2;
                        if (this.rect.centerx < enemy.fullHitRect.centerx && dx > 0) {
                            this.rect.right = enemy.fullHitRect.left; this.x = this.rect.x;
                            let eOrig = enemy.terrainRect.copy();
                            enemy.x += pushSpeed; enemy.rect.x = Math.floor(enemy.x);
                            for (let p of platforms) {
                                if (!p.passable && enemy.terrainRect.colliderect(p.rect)) {
                                    if (p.isWall || p.exposedLeft) {
                                        if (eOrig.right <= p.rect.left) { enemy.rect.right = p.rect.left; enemy.x = enemy.rect.x; }
                                    }
                                }
                            }
                        } else if (this.rect.centerx > enemy.fullHitRect.centerx && dx < 0) {
                            this.rect.left = enemy.fullHitRect.right; this.x = this.rect.x;
                            let eOrig = enemy.terrainRect.copy();
                            enemy.x -= pushSpeed; enemy.rect.x = Math.floor(enemy.x);
                            for (let p of platforms) {
                                if (!p.passable && enemy.terrainRect.colliderect(p.rect)) {
                                    if (p.isWall || p.exposedRight) {
                                        if (eOrig.left >= p.rect.right) { enemy.rect.left = p.rect.right; enemy.x = enemy.rect.x; }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }

    jumpAndDrop(keys) {
        let isX = keys["KeyX"] || keys["x"] || keys["X"];
        let isDown = keys["ArrowDown"] || keys["s"] || keys["S"];

        if (this.sweptBy) {
            if (isX) {
                this.velY = this.jumpPower; this.onGround = false; this.sweptBy = null;
                this.invincibleTimer = Math.floor(FPS * 1.5);
            }
            return;
        }
        if (this.kickFreezeTimer > 0) {
            if (isX) { this.velY = this.jumpPower; this.onGround = false; this.kickFreezeTimer = 0; }
            return;
        }
        
        if (this.onGround) {
            if (isX) { 
                if (isDown) { 
                    if (this.currentPlatform && this.currentPlatform.passable) {
                        this.y += 5; this.rect.y = Math.floor(this.y); 
                        this.onGround = false; this.currentPlatform = null;
                    }
                } else { 
                    this.velY = this.jumpPower; this.onGround = false; this.currentPlatform = null;
                }
            }
        }
    }

    applyPhysics(platforms, enemies) {
        if (this.sweptBy || this.kickFreezeTimer > 0) return;
        let prevBottom = this.rect.bottom;
        let prevTop = this.rect.top;
        
        this.velY += this.gravity; this.y += this.velY; this.rect.y = Math.floor(this.y);
        this.onGround = false;
        
        for (let plat of platforms) {
            if (plat.isWall || plat.exposedTop) {
                if (this.floorRect.colliderect(plat.rect) && this.velY > 0 && prevBottom <= plat.rect.top + 2) {
                    this.rect.bottom = plat.rect.top; this.y = this.rect.y; this.velY = 0; 
                    this.onGround = true; this.currentPlatform = plat;
                }
            }
            if (!plat.passable && this.rect.colliderect(plat.rect) && this.velY < 0 && prevTop >= plat.rect.bottom - 2) {
                this.rect.top = plat.rect.bottom; this.y = this.rect.y; this.velY = 0;
            }
        }
        
        for (let enemy of enemies) {
            if (enemy.snowLevel >= 4 && enemy.rollingDir === 0) {
                if (this.rect.colliderect(enemy.fullHitRect) && this.velY > 0 && prevBottom <= enemy.fullHitRect.top + 2) {
                    this.rect.bottom = enemy.fullHitRect.top; this.y = this.rect.y; this.velY = 0; this.onGround = true;
                }
            }
        }
    }

    shoot(keys, snowballs, shootSound) {
        if (this.sweptBy) return;
        if (this.shootCooldown > 0) this.shootCooldown--;
        
        let isZ = keys["KeyZ"] || keys["z"] || keys["Z"];
        if (isZ && this.shootCooldown === 0) {
            let startX = this.facing === 1 ? this.rect.right : this.rect.left;
            snowballs.push(new Snowball(startX, this.rect.centery - 44, this.facing, startX));
            this.shootCooldown = 15; this.attackTimer = 15;
            shootSound.play();
        }
    }

    update() {
        if (this.invincibleTimer > 0) this.invincibleTimer--;
        if (this.kickFreezeTimer > 0) this.kickFreezeTimer--;
        if (this.attackTimer > 0) this.attackTimer--;
    }

    draw(ctx, isTransitioning = false) {
        if (isTransitioning) { drawImageOrFallback(ctx, this.imgClear, this.rect.x, this.rect.y); return; }
        if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer / 5) % 2 !== 0) return;

        let img = this.facing === 1 ? this.imgR : this.imgL;
        if (this.sweptBy) img = this.sweptBy.rollingDir === 1 ? this.imgDownR : this.imgDownL;
        else if (this.attackTimer > 0) img = this.facing === 1 ? this.imgAttackR : this.imgAttackL;
        else if (this.isCrouching) img = this.facing === 1 ? this.imgDownR : this.imgDownL;

        if (this.sweptBy || this.attackTimer > 0 || this.isCrouching) {
            drawImageOrFallback(ctx, img, this.rect.centerx, this.rect.bottom, true);
        } else {
            drawImageOrFallback(ctx, img, this.rect.x, this.rect.y);
        }
    }
}

// --- 4. 메인 변수 및 사운드 설정 ---
const keys = {}; const keysPressed = {}; 
window.addEventListener("keydown", (e) => { 
    keys[e.code] = true; keysPressed[e.code] = true; 
    if(e.key) { keys[e.key.toLowerCase()] = true; keysPressed[e.key.toLowerCase()] = true; }
});
window.addEventListener("keyup", (e) => { 
    keys[e.code] = false; 
    if(e.key) { keys[e.key.toLowerCase()] = false; }
});

let mx = 0, my = 0; let hoverLine = null; let draggingLineIdx = null; let isMouseDownL = false; let isMouseDownR = false;
window.addEventListener("mousemove", (e) => {
    let r = canvas.getBoundingClientRect();
    let scaleX = canvas.width / r.width; let scaleY = canvas.height / r.height;
    mx = Math.floor((e.clientX - r.left) * scaleX) - OFFSET_X;
    my = Math.floor((e.clientY - r.top) * scaleY);
});
window.addEventListener("mousedown", (e) => {
    if(e.button === 0) isMouseDownL = true;
    if(e.button === 2) isMouseDownR = true;
    if(editorMode && e.button === 0 && hoverLine !== null) draggingLineIdx = hoverLine;
});
window.addEventListener("mouseup", (e) => {
    if(e.button === 0) isMouseDownL = false;
    if(e.button === 2) isMouseDownR = false;
    if(draggingLineIdx !== null) { draggingLineIdx = null; autoSaveCurrentStage(currentStage, platforms, enemies, colWidths, allMapData); }
});
window.addEventListener("wheel", (e) => {
    if(editorMode) {
        autoSaveCurrentStage(currentStage, platforms, enemies, colWidths, allMapData);
        currentStage = Math.max(1, Math.min(currentStage + (e.deltaY > 0 ? 1 : -1), MAX_STAGES)); 
        let [p, en, c] = getStageData(allMapData, currentStage);
        platforms = p; enemies = en; colWidths = c;
        stageHadEnemies = enemies.length > 0;
        player.respawn(); snowballs = []; effects = [];
    }
});

let allMapData = loadAllStages();
let currentStage = 1;
let [platforms, enemies, colWidths] = getStageData(allMapData, currentStage);
let stageHadEnemies = enemies.length > 0;
const player = new Player(100, HEIGHT - FLOOR_THICKNESS - 139);
let snowballs = [], effects = [];

let gameCtx = document.createElement('canvas').getContext('2d');
gameCtx.canvas.width = WIDTH; gameCtx.canvas.height = HEIGHT;

let editorMode = false, gameOver = false, gameClear = false, currentBrush = 1;
let gameOverTimer = 0, gameClearTimer = 0;
let isTransitioning = false, transitionY = 0;

// [핵심 추가] 실제 사운드 파일 로드
let bgmSound = loadSound("bgm.wav", true); // BGM은 반복 재생 (loop: true)
let shootSound = loadSound("snowflake.wav");
let deadSound = loadSound("dead.wav"); 
let kickSound = loadSound("kick.wav");
let rollingSound = loadSound("rolling.wav"); 
let boomSound = loadSound("boom.wav"); 
let gameoverSound = loadSound("gameover.wav");
let killSound = loadSound("kill.wav"); 
let goodbyeSound = loadSound("goodbye.wav");

// 사용자 상호작용 후 BGM 시작 (브라우저 정책 준수)
let isGameStarted = false;
window.addEventListener("mousedown", () => {
    if (!isGameStarted) {
        isGameStarted = true;
        bgmSound.play();
    }
});
window.addEventListener("keydown", () => {
    if (!isGameStarted) {
        isGameStarted = true;
        bgmSound.play();
    }
});

// --- 5. 게임 루프 ---
function gameLoop() {
    updatePlatformEdges(platforms);
    let lineXs = [WALL_THICKNESS];
    for (let w of colWidths) lineXs.push(lineXs[lineXs.length - 1] + w);
    hoverLine = null;

    if (keysPressed["Escape"]) {
        if (editorMode) {
            autoSaveCurrentStage(currentStage, platforms, enemies, colWidths, allMapData);
            if (enemies.length > 0) stageHadEnemies = true;
        }
        editorMode = !editorMode;
    }
    if (editorMode) {
        if(draggingLineIdx === null) {
            for(let i = 1; i < lineXs.length - 1; i++) {
                if(Math.abs(mx - lineXs[i]) <= 5) { hoverLine = i; break; }
            }
        }
        canvas.style.cursor = (hoverLine !== null || draggingLineIdx !== null) ? "col-resize" : "default";

        if(draggingLineIdx !== null) {
            let i = draggingLineIdx;
            let newX = Math.max(lineXs[i-1] + 20, Math.min(mx, lineXs[i+1] - 20));
            let dx = newX - lineXs[i];
            if (dx !== 0) {
                let oldLineI = lineXs[i]; colWidths[i-1] += dx; colWidths[i] -= dx; lineXs[i] = newX;
                for (let p of platforms) {
                    if (p.isWall) continue;
                    if (p.rect.x === lineXs[i-1]) p.rect.width += dx;
                    else if (p.rect.x === oldLineI) { p.rect.x += dx; p.rect.width -= dx; }
                }
                for (let e of enemies) {
                    if (lineXs[i-1] <= e.x && e.x < oldLineI) { e.x += dx/2; e.rect.x = Math.floor(e.x); }
                    else if (oldLineI <= e.x && e.x < lineXs[i+1]) { e.x += dx/2; e.rect.x = Math.floor(e.x); }
                }
            }
        }

        if (keysPressed["KeyE"] || keysPressed["e"]) {
            let cIdx = lineXs.findIndex((x, j) => j < lineXs.length - 1 && x <= mx && mx < lineXs[j+1]);
            if (cIdx !== -1) enemies.push(new Enemy(lineXs[cIdx] + Math.floor(colWidths[cIdx]/2) - 64, Math.floor(my/GRID_H)*GRID_H + GRID_H - 123));
        } else if (keysPressed["Digit1"]) currentBrush = 1;
        else if (keysPressed["Digit2"]) currentBrush = 2;
        else if (keysPressed["KeyS"] || keysPressed["s"]) { 
            let cIdx = lineXs.findIndex((x, j) => j < lineXs.length - 1 && x <= mx && mx < lineXs[j+1]);
            if (cIdx !== -1 && colWidths[cIdx] >= 40) {
                let oldGx = lineXs[cIdx], oldGw = colWidths[cIdx];
                let w1 = Math.floor(oldGw/2), w2 = oldGw - w1;
                colWidths[cIdx] = w1; colWidths.splice(cIdx + 1, 0, w2);
                let newPlats = platforms.filter(p => !p.isWall && p.rect.x === oldGx && p.rect.width === oldGw).map(p => new Platform(oldGx + w1, p.rect.y, w2, p.rect.height, p.passable, false));
                platforms.forEach(p => { if(!p.isWall && p.rect.x === oldGx && p.rect.width === oldGw) p.rect.width = w1; });
                platforms.push(...newPlats); autoSaveCurrentStage(currentStage, platforms, enemies, colWidths, allMapData);
            }
        }

        if (draggingLineIdx === null && hoverLine === null) {
            let cIdx = lineXs.findIndex((x, j) => j < lineXs.length - 1 && x <= mx && mx < lineXs[j+1]);
            if (cIdx !== -1) {
                let gx = lineXs[cIdx], gw = colWidths[cIdx], gy = Math.floor(my/GRID_H)*GRID_H;
                if (isMouseDownL && gy < HEIGHT - FLOOR_THICKNESS) {
                    if(!platforms.some(p => !p.isWall && new Rect(gx, gy, gw, GRID_H).colliderect(p.rect))) {
                        platforms.push(new Platform(gx, gy, gw, GRID_H, currentBrush === 1));
                    }
                } else if (isMouseDownR) {
                    platforms = platforms.filter(p => p.isWall || !p.rect.collidepoint(mx, my));
                    enemies = enemies.filter(e => !e.rect.collidepoint(mx, my));
                }
            }
        }
    } else {
        canvas.style.cursor = "default";
    }
    for (let k in keysPressed) keysPressed[k] = false;

    // ---------------------------------
    if (!editorMode && !gameOver && !gameClear) {
        if (isTransitioning) {
            transitionY += 15; player.y -= 10; player.rect.y = Math.floor(player.y);
            if (transitionY >= SCREEN_HEIGHT) {
                currentStage++; let [p, en, c] = getStageData(allMapData, currentStage);
                platforms = p; enemies = en; colWidths = c;
                stageHadEnemies = enemies.length > 0; isTransitioning = false; player.respawn();
            }
        } else {
            effects = effects.filter(ef => !ef.update());
            for (let e of enemies) {
                if (e.rollingDir !== 0 && !e.isDead && !player.sweptBy && player.invincibleTimer === 0 && player.kickFreezeTimer === 0 && player.rect.colliderect(e.fullHitRect)) {
                    player.sweptBy = e;
                }
            }

            player.moveX(keys, enemies, platforms); player.jumpAndDrop(keys); player.applyPhysics(platforms, enemies);
            if (player.y > HEIGHT + 200) {
                deadSound.play(); player.lives--;
                if (player.lives < 0) { 
                    bgmSound.stop(); gameoverSound.play(); gameOver = true; 
                } else player.respawn();
            }
            player.shoot(keys, snowballs, shootSound); player.update();

            snowballs = snowballs.filter(sb => {
                if (sb.update()) { effects.push(new Effect(sb.rect.centerx, sb.rect.centery, 60, 60)); return false; }
                if (platforms.some(p => !p.passable && sb.rect.colliderect(p.rect))) { effects.push(new Effect(sb.rect.centerx, sb.rect.centery, 60, 60)); return false; }
                for (let e of enemies) {
                    if (e.rollingDir === 0 && sb.rect.colliderect(e.fullHitRect)) {
                        e.facing = e.rect.centerx < player.rect.centerx ? -1 : 1;
                        if (e.snowLevel < 4) { e.snowLevel++; e.meltTimer = 0; }
                        else { e.x -= 10 * sb.direction; e.rect.x = Math.floor(e.x); }
                        effects.push(new Effect(sb.rect.centerx, sb.rect.centery, 60, 60)); return false;
                    }
                }
                return true;
            });

            for (let re of enemies) {
                if (re.rollingDir !== 0) {
                    for (let te of enemies) {
                        if (te !== re && te.rollingDir === 0 && !te.isDead && re.fullHitRect.colliderect(te.fullHitRect)) {
                            if (te.snowLevel >= 4) {
                                let tmp = re.rollingDir; re.rollingDir = re.rollingDir * -1; te.rollingDir = tmp;
                                if (re.rollingDir > 0) re.x = te.fullHitRect.right + 1;
                                else re.x = te.fullHitRect.left - re.hitWidth - 1;
                                re.rect.x = Math.floor(re.x); rollingSound.play();
                            } else { te.isDead = true; killSound.play(); }
                        }
                    }
                }
            }

            for (let e of enemies) {
                e.applyPhysics(platforms); e.updateLogic(platforms, rollingSound);
                let isZ = keys["KeyZ"] || keys["z"] || keys["Z"];
                if (e.snowLevel >= 4 && e.rollingDir === 0) {
                    if (player.rect.inflate(10, 10).colliderect(e.fullHitRect) && isZ && player.kickFreezeTimer === 0) {
                        e.rollingDir = player.facing; player.kickFreezeTimer = Math.floor(FPS * 0.2); kickSound.play();
                    } else if (player.velY < 0 && player.rect.colliderect(e.fullHitRect)) {
                        if (player.rect.top > e.fullHitRect.top + (e.hitHeight * 0.4)) { e.velY = player.jumpPower; e.y += e.velY; kickSound.play(); }
                    }
                }
            }

            for (let e of enemies) {
                if (e.snowLevel === 0 && !e.isDead && player.rect.colliderect(e.fullHitRect)) {
                    if (player.sweptBy || player.invincibleTimer > 0) continue;
                    deadSound.play(); player.lives--;
                    if (player.lives < 0) { 
                        bgmSound.stop(); gameoverSound.play(); gameOver = true; 
                    } else { player.respawn(); break; }
                }
            }

            for (let e of enemies) { if (e.isDead && e.snowLevel >= 4) { effects.push(new Effect(e.rect.centerx, e.rect.centery, e.rect.width, e.rect.height)); boomSound.play(); } }
            enemies = enemies.filter(e => !e.isDead);

            if (player.sweptBy && player.sweptBy.isDead) { player.sweptBy = null; player.invincibleTimer = Math.floor(FPS * 1.5); }

            if (enemies.length === 0 && stageHadEnemies) {
                if (currentStage < MAX_STAGES) {
                    isTransitioning = true; transitionY = 0; snowballs = []; effects = []; stageHadEnemies = false;
                } else { 
                    gameClear = true; bgmSound.stop(); goodbyeSound.play(); stageHadEnemies = false; 
                }
            }
        }
    }

    // ---------------------------------
    // [핵심 변경] 배경 렌더링
    // ---------------------------------
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (isTransitioning) {
        // 위로 올라가는 현재 스테이지 배경
        drawImageOrFallback(ctx, bgImgs[currentStage], 0, transitionY);
        // 아래에서 따라 올라오는 다음 스테이지 배경
        if (currentStage + 1 <= MAX_STAGES) {
            drawImageOrFallback(ctx, bgImgs[currentStage + 1], 0, transitionY - SCREEN_HEIGHT);
        }
    } else {
        // 평상시 현재 스테이지 배경
        drawImageOrFallback(ctx, bgImgs[currentStage], 0, 0);
    }

    // 게임 캐릭터 및 플랫폼 레이어 그리기
    gameCtx.clearRect(0, 0, gameCtx.canvas.width, gameCtx.canvas.height);

    if (editorMode) {
        gameCtx.strokeStyle = "rgba(200, 200, 200, 0.8)"; gameCtx.lineWidth = 2;
        for (let x of lineXs) { gameCtx.beginPath(); gameCtx.moveTo(x, 0); gameCtx.lineTo(x, HEIGHT - FLOOR_THICKNESS); gameCtx.stroke(); }
        for (let y = 0; y <= HEIGHT - FLOOR_THICKNESS; y += GRID_H) { gameCtx.beginPath(); gameCtx.moveTo(WALL_THICKNESS, y); gameCtx.lineTo(WIDTH - WALL_THICKNESS, y); gameCtx.stroke(); }
    }
    
    platforms.forEach(p => p.draw(gameCtx));
    enemies.forEach(e => e.draw(gameCtx));
    snowballs.forEach(sb => sb.draw(gameCtx));
    effects.forEach(ef => ef.draw(gameCtx));
    player.draw(gameCtx, isTransitioning);

    ctx.drawImage(gameCtx.canvas, OFFSET_X, 0);

    // [핵심 변경] UI 및 클리어 렌더링
    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0,0,SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = "red"; ctx.font = "bold 72px Arial"; ctx.textAlign = "center";
        ctx.fillText("GAME OVER", SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2);
    } else if (gameClear) {
        drawImageOrFallback(ctx, goodbyeImg, 0, 0); // 굿바이 화면 띄우기
    } else {
        // UI 이미지 (좌상단 생명력 표시)
        if (player.lives === 2) drawImageOrFallback(ctx, uiTwoImg, 0, 0);
        else if (player.lives === 1) drawImageOrFallback(ctx, uiOneImg, 0, 0);
        else if (player.lives <= 0) drawImageOrFallback(ctx, uiZeroImg, 0, 0);

        ctx.fillStyle = "black"; ctx.font = "36px Arial"; ctx.textAlign = "right";
        ctx.fillText(`Stage: ${currentStage}`, SCREEN_WIDTH - 200, 50);
        
        if (!isGameStarted) {
            ctx.fillStyle = "blue"; ctx.textAlign = "center";
            ctx.fillText("클릭하거나 키보드를 눌러 사운드와 함께 시작하세요!", SCREEN_WIDTH / 2, 50);
        }

        if (editorMode) {
            ctx.fillStyle = "red"; ctx.font = "24px Arial"; ctx.textAlign = "left";
            let mode = currentBrush === 1 ? "Plat(반투명 점프용)" : "Wall(통과 불가 벽)";
            ctx.fillText(`EDITOR STAGE ${currentStage} - ${mode} (1: Plat, 2: Wall, E: Enemy, S: Split)`, 20, 40);
        }
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
</body>
</html>
